[project]
name = "toolquant"
version = "0.0.1"
description = "Tool-call-guided per-layer-group precision search for small LMs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlflow>=2.16",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
