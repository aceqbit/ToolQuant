[project]
name = "toolquant"
version = "0.0.1"
description = "Tool-call-guided per-layer-group precision search for small LMs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "accelerate>=1.16.0",
    "fastapi>=0.115",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-sdk>=1.27",
    "uvicorn>=0.30",
    "datasets>=5.2.0",
    "matplotlib>=3.11.2",
    "mlflow>=2.16",
    "numpy>=2.5.5",
    "onnx>=1.23.2",
    "onnx-ir>=1.1.0",
    "onnxruntime>=1.32.0",
    "onnxruntime-genai>=0.20.0",
    "scipy>=1.18.1",
    "statsmodels>=0.15.0",
    "torch>=2.15.0",
    "transformers>=5.24.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toolquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
